name: verify-mcp-readback

on:
  # The first run bootstraps this branch because GitHub requires a
  # workflow_dispatch file to exist on the default branch before dispatching.
  push:
    branches:
      - audit/57015-mcp-readback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mcp-readback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-test:
    name: Focused MCP readback regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out the verification branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - name: Record runner capacity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner capacity"
            echo
            echo '```text'
            df -h
            echo
            free -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the focused regression test
        id: focused_test
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR="$RUNNER_TEMP/codex-target"
          log_file="$RUNNER_TEMP/mcp-readback-test.log"
          cargo test -p codex-tui activity_metadata_is_retained_without_including_outputs --lib 2>&1 | tee "$log_file"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          python3 - "$log_file" "$exit_code" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib
          import sys

          log_path = pathlib.Path(sys.argv[1])
          exit_code = sys.argv[2]
          text = log_path.read_text(errors="replace")
          result_lines = [
              line for line in text.splitlines() if line.startswith("test result:")
          ]

          print("## Focused regression test")
          print()
          print("- Command: `cargo test -p codex-tui activity_metadata_is_retained_without_including_outputs --lib`")
          print(f"- Exit code: `{exit_code}`")
          if result_lines:
              print("- Test result lines:")
              for line in result_lines:
                  print(f"  - `{line}`")
          else:
              print("- Test result lines: none emitted (inspect the uploaded log).")
          PY

          exit "$exit_code"

      - name: Upload focused test log and report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mcp-readback-validation-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/mcp-readback-test.log
